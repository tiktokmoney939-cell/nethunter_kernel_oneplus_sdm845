name: Build NetHunter Kernel OnePlus 6

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        # expect စနစ်ကို အသစ်ထည့်သွင်းထားပါသည်
        sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 zip unzip ccache expect

    - name: Build the Kernel
      run: |
        export TERM=xterm
        ROOT_DIR=$(pwd)
        
        BUILD_SCRIPT=$(find . -name "build.sh" | head -n 1)
        CONFIG_FILE=$(find . -name "local.config" | head -n 1)
        BUILD_DIR=$(dirname "$BUILD_SCRIPT")
        
        if [ -n "$CONFIG_FILE" ]; then
          cp "$CONFIG_FILE" "$BUILD_DIR/"
        fi
        
        cd "$BUILD_DIR"
        chmod +x build.sh
        
        # Script ၏ မေးခွန်းများကို အဆင့်လိုက် အတိအကျ ဖြေပေးမည့် စနစ်
        cat << 'EOF' > auto_build.exp
        set timeout -1
        spawn ./build.sh
        
        expect "Enter selection"
        send "S\r"
        
        expect "Enter selection"
        send "T\r"
        
        expect "Edit the kernel config?"
        send "n\r"
        
        expect "to continue.."
        send "\r"
        
        expect "Enter selection"
        send "E\r"
        
        expect eof
        EOF
        
        expect auto_build.exp

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-OP6-Build
        path: "**/*.zip" 
        
