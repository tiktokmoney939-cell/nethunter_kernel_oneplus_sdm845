name: Build NetHunter Kernel OnePlus 6

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 zip unzip

    - name: Build the Kernel
      run: |
        export TERM=xterm
        ROOT_DIR=$(pwd)
        
        BUILD_SCRIPT=$(find . -name "build.sh" | head -n 1)
        CONFIG_FILE=$(find . -name "local.config" | head -n 1)
        BUILD_DIR=$(dirname "$BUILD_SCRIPT")
        
        # အစ်ကို ထောက်ပြထားသော local.config ကူးထည့်သည့် အဆင့် (Menu ထပ်မပေါ်စေရန်)
        if [ -n "$CONFIG_FILE" ]; then
          cp "$CONFIG_FILE" "$BUILD_DIR/"
          echo "Config file copied successfully."
        fi
        
        cd "$BUILD_DIR"
        chmod +x build.sh
        
        # 'T' ကိုရွေးမည်၊ နောက်ထပ် မေးလာပါက 'n' (No) ဟု အလိုအလျောက် ဖြေပေးမည်
        printf "T\nn\n" | ./build.sh

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-OP6-Build
        path: "**/*.zip" 
